<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ကစားသမား စာရင်း (No. | Username)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-color: #400000; 
            background-image: linear-gradient(to bottom, #400000, #660000);
            overflow-x: hidden; 
            position: relative;
            padding-top: 6rem;
        }
        
        @keyframes fall {
            to { transform: translateY(100vh); }
        }
        .snowflake {
            position: absolute;
            background: #FFFFFF;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.8;
            will-change: transform;
            animation-name: fall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            z-index: 10;
        }

        #list-container::-webkit-scrollbar { width: 8px; }
        #list-container::-webkit-scrollbar-track { background: #330000; border-radius: 10px; }
        #list-container::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 10px; }

        .player-row:nth-child(even) { background-color: rgba(90, 0, 0, 0.6); }
        .player-row:nth-child(odd) { background-color: rgba(102, 0, 0, 0.6); }
        .player-row:hover { background-color: rgba(130, 0, 0, 0.7) !important; }

        .player-cell {
            padding: 10px 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }
    </style>
</head>
<body class="antialiased text-white relative pt-24 pb-10"> 
    
    <nav class="fixed top-0 left-0 right-0 z-50 bg-[#590000] shadow-xl border-b border-yellow-300/50 h-20 flex items-center">
        <div class="container mx-auto px-4 flex justify-between items-center w-full">
            <div class="flex items-center space-x-3">
                <img src="https://i0.wp.com/gkk777.net/wp-content/uploads/2025/05/photo_2024-05-05_18-26-46.jpg?fit=640%2C640&ssl=1" 
                     alt="GKK 99 Logo" 
                     class="h-10 w-10 rounded-lg border-2 border-yellow-300 object-cover"
                     onerror="this.src='https://placehold.co/40x40/ffd700/400000?text=L';">
                <span class="text-xl font-bold text-yellow-300 hidden sm:inline">GKK777</span>
            </div>
            <button onclick="window.location.href='https://gkk777cta.mssg.me/'"
                    class="px-4 py-2 bg-yellow-400 text-[#400000] font-semibold rounded-full shadow-md hover:bg-yellow-300 transition duration-300 transform hover:scale-105 active:scale-95">
                ဆက်သွယ်ရန်
            </button>
        </div>
    </nav>
    
    <div class="container mx-auto px-4 w-full max-w-sm md:max-w-md lg:max-w-lg z-10 relative">
        <header class="text-center mb-6">
            <h1 class="text-4xl font-extrabold text-yellow-300 drop-shadow-lg">Congratulations</h1>
            <p class="text-lg text-white-200 mt-1">
                2026 နှစ်သစ် ကံကောင်းခြင်း ငွေသွင်းမလို အခမဲ့ဘောနပ်ကို Channel Join ရရှိသွားသောမန်ဘာများ
            </p>
        </header>

        <div id="list-container" class="bg-[#590000]/70 rounded-xl shadow-2xl backdrop-blur-sm border border-[#660000]/50 overflow-hidden overflow-y-auto h-[70vh] w-full">
            <table class="min-w-full divide-y divide-[#660000]">
                <thead class="bg-[#590000] sticky top-0 z-20 shadow-lg border-b border-yellow-300">
                    <tr>
                        <th scope="col" class="player-cell w-1/4 font-extrabold text-sm uppercase tracking-wider text-yellow-300">No</th>
                        <th scope="col" class="player-cell w-3/4 font-extrabold text-sm uppercase tracking-wider text-yellow-300">Username</th>
                    </tr>
                </thead>
                <tbody id="player-table-body" class="bg-transparent divide-y divide-[#660000]"></tbody>
            </table>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tableBody = document.getElementById('player-table-body');
            const body = document.body;
            const SNOWFLAKE_COUNT = 80;
            const MAX_PLAYERS = 300;

            function maskUsername(username) {
                if (!username) return "";
                let masked = "";
                let charCount = 0; 
                for (let i = 0; i < username.length; i++) {
                    const char = username[i];
                    if (char === ' ') { masked += ' '; } 
                    else {
                        masked += (charCount % 2 === 0) ? char : '*';
                        charCount++;
                    }
                }
                return masked;
            }
            
            function createSnowflake() {
                const snowflake = document.createElement('div');
                snowflake.classList.add('snowflake');
                const size = Math.random() * 3 + 1; 
                snowflake.style.width = `${size}px`;
                snowflake.style.height = `${size}px`;
                snowflake.style.left = `${Math.random() * 100}vw`;
                snowflake.style.animationDuration = `${Math.random() * 20 + 10}s`;
                snowflake.style.animationDelay = `-${Math.random() * 15}s`;
                snowflake.style.top = `${-Math.random() * 100}px`;
                body.appendChild(snowflake);
            }

            for (let i = 0; i < SNOWFLAKE_COUNT; i++) { createSnowflake(); }

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }
            
            function generatePlayerList() {
                // အသစ်ပေးထားသော ID ၃၀ ခု
                const newIDs = [
                    "kkzaw123", "09440890670", "sawaear", "09689837635", "09692524239",
                    "09267458647", "09778581234", "kyikhin", "09668515271", "09891348863",
                    "09750253088", "09943923525", "09250167624", "nay717", "09774615545",
                    "yair78", "09773062702", "09740944438", "09442183761", "09261957707",
                    "09973993898", "09673341279", "09424484227", "09449996270", "09955323114",
                    "09883262366", "09689986963", "09974977848", "09680513996", "09650795917"
                ];

                // နဂိုရှိပြီးသား ID များထဲမှ အချို့
                const previousIDs = [
                    "akuma073", "09785163916", "09968380242", "09787054159", "09254510425",
                    "nayminhtun", "09442002678", "ams17", "09260190305", "09787736669",
                    "ssmmhh17", "aungmai", "09669622300", "09688488722", "aungmyoswe",
                    "marlar121", "09660203586", "aung135790", "2173710", "09501384000",
                    "aungzinmoe", "09671623279", "09400460796", "tsix2025", "aungzin19", 
                    "kcl2025", "yaykhae7", "09788227225", "09421107699", "09788225225"
                ];

                // Generic IDs များ (၃၀၀ ပြည့်ရန်)
                const genericIDs = [];
                for(let i=1; i<=240; i++) {
                    genericIDs.push("09" + Math.floor(Math.random() * 900000000 + 100000000));
                }

                let finalUsernames = newIDs.concat(previousIDs, genericIDs).slice(0, MAX_PLAYERS);
                shuffleArray(finalUsernames); 

                const fragment = document.createDocumentFragment();
                finalUsernames.forEach((name, index) => {
                    const row = document.createElement('tr');
                    row.className = "player-row transition duration-150";
                    row.innerHTML = `
                        <td class="player-cell whitespace-nowrap text-sm font-medium text-yellow-300">${index + 1}</td>
                        <td class="player-cell whitespace-nowrap text-base font-semibold text-white">${maskUsername(name)}</td>
                    `;
                    fragment.appendChild(row);
                });
                tableBody.appendChild(fragment);
            }

            generatePlayerList();
        });
    </script>
</body>
</html>
